name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  static:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      # Browser-mode Vitest needs the Chromium binary + its system libraries
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm test
